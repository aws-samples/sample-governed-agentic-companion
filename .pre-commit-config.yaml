# Pre-commit hooks for the Governed Agentic Companion.
# Install once:  pip install pre-commit && pre-commit install
# Run on demand: pre-commit run --all-files
#
# These are LOCAL verification hooks (Tenet 1/3 — nothing deploys or mutates). They
# catch secrets, customer-data leakage, and malformed files BEFORE a commit, so the
# same checks the GitLab pipeline runs pass on the first push.

repos:
  # Basic hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: check-json
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        # Terraform-adjacent YAML only; skip generated/vendored trees.
        exclude: '^(\.terraform/|.*/cdk\.out/)'

  # Secret detection (mirrors the GitLab Secret-Detection job locally).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: ["detect", "--config", ".gitleaks.toml", "--redact", "--staged"]

  # Repo-local guardrails — the same scripts CI runs, so local == CI.
  - repo: local
    hooks:
      - id: leak-scan
        name: customer-data / secret leak scan
        entry: scripts/leak_scan.sh
        language: script
        pass_filenames: false
      - id: yaml-validation
        name: tracked-YAML parse check
        entry: scripts/validate_yaml.sh
        language: script
        pass_filenames: false
