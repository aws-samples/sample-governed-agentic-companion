# Golden natural-language diagram prompts (design D8, Appendix G). Ids refer to the 3.4.0
# example KB (knowledge/tier_a/*/diagram_facts.yaml) or to a fixture KB under
# tests/golden/fixtures/<fixture>/. Generic, customer-agnostic content only.
#
# Fields:
#   id, prompt         the row; "__ACCESS_KEY__" is replaced at run time by an access-key shape
#                      assembled in the test (no secret-shaped string is stored here)
#   fixture            "" (shipped KB) or a tests/golden/fixtures/<name> KB
#   expect             render | decline
#   scope              the deterministic planner's scope ("" for a preset or a decline)
#   views              the exact view-id list in deterministic mode ("generic" = one generic view)
#   include            qids rendered in at least one view ("*" = every catalogue node and edge)
#   exclude            qids with status `excluded` (drawn in no view)
#   quality            the expected outcome per view (pass = score >= 85, no FAIL/FIX)
#   text_contains      substrings of the gated text
#   text_absent        substrings that must not appear in the gated text
#   mock_plan          the MockPlanner plan for the opt-in planner mode (plan item 13):
#                      {from_include: true, scope} = selected is the include set
rows:
  - id: 1
    prompt: "draw gac pvt architecture end to end"
    fixture: ""
    expect: render
    scope: end-to-end
    views: [private-request-path, gateway-to-runtimes, kb-ingestion, bedrock-calls]
    include: ["*"]
    exclude: []
    quality: [pass, pass, pass, pass]
    text_contains: ["Drawn from the knowledge base, not from the live deployment."]
    text_absent: ["Not in the knowledge base"]
    mock_plan: {from_include: true, scope: end-to-end}
