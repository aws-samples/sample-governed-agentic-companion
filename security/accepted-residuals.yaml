# Accepted image-scan residuals (kits 3.3.1, 3.4.0 and 3.4.1). Read by scripts/security_gate.sh.
#
# The gate fails on ANY Trivy or Grype finding, at any severity, unless the finding matches an
# entry below on all three of: vulnerability id, package name and installed version. A version
# match means a base re-pin cannot carry an entry forward silently: the new package version no
# longer matches, so the finding fails the gate until the entry is reviewed again.
# The gate also fails when today is after an entry's review_by date.
#
# Every entry needs the repository owner's approval, recorded in approved_by / approved_on, and
# is listed in docs/security/scan-results.md ("Accepted image residuals").
#
# History: the 2026-11-02 pin carried three residuals (R1 CVE-2026-115557, R2 CVE-2026-103995,
# R3 CVE-2026-114583). The 2026-11-03 re-pin (Python 3.15.2) fixes R1 and R3, so they are
# removed; R2 was re-approved for the new package version. R4 (CVE-2026-119586, sqlite-libs) was
# approved on 2026-11-05 for the same 2026-11-03 base; it affects 3.3.1 and 3.4.0 images alike.
# R5 (CVE-2026-84243, glibc) and R6 (CVE-2026-116566, python-3.15) were approved on 2026-11-06
# for the same base; they also affect the deployed 3.3.1 and 3.4.0 images.
residuals:
  - id: CVE-2026-103995
    package: python-3.15
    version: 3.15.2_git20261030-r0
    severity: Low (Grype, NVD); not reported by Trivy
    status: accepted-residual
    reason: >-
      http.client chunk-size and Content-Length parsing. No released CPython line has the fix
      (NVD range < 3.16.0); every evaluated base image carries it.
    evidence: >-
      /usr/lib/python3.15/http/client.py in the image has no _is_legal_chunk_size validation
      (checked 2026-11-03 on Python 3.15.2).
    exposure: >-
      Assessment, not tested: the engine makes outbound HTTP calls only to AWS endpoints
      through the AWS SDK; it does not parse chunked responses from arbitrary servers.
    approved_by: repository owner
    approved_on: 2026-11-03
    review_by: 2026-11-30
  - id: CVE-2026-119586
    package: sqlite-libs
    version: 3.54.1-r0
    severity: High (Grype, NVD CVSS 3.1 7.8, local, needs user interaction); not reported by Trivy
    status: accepted-residual
    reason: >-
      No upstream fix: Grype lists no fix version, and the newest Wolfi sqlite-libs is 3.54.1-r0
      as of 2026-11-05 (the current Chainguard latest and latest-dev digests ship it too), so no
      base re-pin or pin bump removes it. Re-pin trigger: the first Wolfi sqlite-libs build that
      contains the fix.
    evidence: >-
      The CVE is in the SQLite command-line shell's .recover command. Checked 2026-11-05 in all
      four gate images (gac-orchestrator and gac-mcp_runtime, gate-icons and gate-noicons) with
      `docker run --rm --entrypoint /usr/bin/python <image> -c "import os,glob,sqlite3;
      print([p for p in ('/usr/bin/sqlite3','/bin/sqlite3') if os.path.exists(p)],
      glob.glob('/usr/lib/libsqlite3*'), sqlite3.sqlite_version)"`: no sqlite3 binary, only
      /usr/lib/libsqlite3.so.0 and libsqlite3.so.3.54.1. The runtime stage has no shell. The kit
      code does not import sqlite3 (`grep -rln sqlite agents frontdoor agentcore/app main.py`
      returns nothing). Newest package: `apk policy sqlite-libs` in cgr.dev/chainguard/python:latest-dev.
    exposure: >-
      Assessment, not tested: the vulnerable code path is in the CLI shell, which the images do
      not contain; the library is present only because CPython's optional _sqlite3 module links it.
    approved_by: repository owner
    approved_on: 2026-11-05
    review_by: 2026-11-30

  - id: CVE-2026-84243
    package: glibc-2.44
    version: 2.44-r11
    severity: High (Grype, CVSS 3.1 7.0, AV:L/AC:H/PR:L/UI:N); not reported by Trivy
    status: accepted-residual
    reason: >-
      No upstream fix: Grype fix state is unknown, and the current Chainguard latest
      (sha256:f3e5face39b0...) and latest-dev (sha256:fe4dbb574f81...) digests ship glibc
      2.44-r13, which is still affected, so a re-pin cannot remove it. Re-pin trigger: the first
      Wolfi glibc build listed as fixed.
    evidence: >-
      Advisory GLIBC-SA-2026-0025: gettext accepts '/' or '..' in the LANGUAGE environment
      variable, so a crafted .mo file can be loaded.
    exposure: >-
      Assessment, not tested: exploitation needs LANGUAGE set inside the container. The runtime
      environment is fixed by Terraform and AgentCore, the runtime stage has no shell, and the
      process runs as non-root uid 65532.
    approved_by: repository owner
    approved_on: 2026-11-06
    review_by: 2026-11-30
  - id: CVE-2026-116566
    package: python-3.15
    version: 3.15.2_git20261030-r0
    severity: Medium (Grype, CVSS 4.0 5.3, AV:A/PR:H/UI:P); not reported by Trivy
    status: accepted-residual
    reason: >-
      No fix in a released Wolfi build: still present in 3.15.2_git20261106-r0. The upstream fix
      is cpython PR 160899. Re-pin trigger: the first Wolfi python-3.15 build with the fix.
    evidence: >-
      socket.getaddrinfo accepts null bytes in the host and port. Kit call sites checked
      2026-11-07 (git grep for getaddrinfo, create_connection, socket., urlopen and requests.post):
      the only direct getaddrinfo is agentcore/probe/private_access_probe.py _dns(), with a host
      from GAC_PROBE_GATEWAY_URL / GAC_PROBE_REGION (Lambda env set by Terraform) and port 443;
      the only listener is frontdoor/pkce_token.py on a workstation (127.0.0.1, ports parsed as
      integers from GAC_COGNITO_REDIRECT_PORTS). Other outbound calls (requests, urllib, boto3)
      go to configured, allowlisted AWS hosts. No call resolves a request-derived host or port,
      and agentcore/app makes no direct socket call.
    exposure: >-
      Assessment, not tested: the hosts and ports the kit resolves come from deployment config
      (gateway URL, AWS endpoints), not from user input.
    approved_by: repository owner
    approved_on: 2026-11-06
    review_by: 2026-11-30
